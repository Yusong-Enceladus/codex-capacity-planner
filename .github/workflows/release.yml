name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build ad-hoc signed app
        run: ./scripts/package-release.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            outputs/release/Codex-Capacity-Planner-macOS.zip
            outputs/release/SHA256SUMS.txt
          body: |
            This macOS build is ad-hoc signed and is not notarized with an Apple Developer ID.
            On first launch, Control-click the app and choose Open, or allow it under
            System Settings → Privacy & Security. Verify the download with SHA256SUMS.txt.
            This build targets Apple Silicon (arm64) and bundles its Node.js runtime.
